# /srv/infra/nginx/conf.d/kelvinpeng.conf
#
# Static site for kelvinpeng.com (Vite + React, built artifacts under /srv/sites/kelvinpeng.com)
# Deployed by GitHub Actions via rsync. Reload nginx after first time only.
#
# Assumes outer infra nginx already has:
#   - global gzip / brotli
#   - SSL wildcard cert *.kelvinpeng.com mounted at /etc/nginx/certs/

# Redirect HTTP → HTTPS (apex + www)
server {
    listen 80;
    listen [::]:80;
    server_name kelvinpeng.com www.kelvinpeng.com;
    return 301 https://kelvinpeng.com$request_uri;
}

# Redirect www → apex on HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kelvinpeng.com;

    ssl_certificate     /etc/nginx/certs/kelvinpeng.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/kelvinpeng.com/privkey.pem;

    return 301 https://kelvinpeng.com$request_uri;
}

# Main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kelvinpeng.com;

    ssl_certificate     /etc/nginx/certs/kelvinpeng.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/kelvinpeng.com/privkey.pem;

    root /srv/sites/kelvinpeng.com;
    index index.html;

    # Security headers
    add_header X-Frame-Options              "SAMEORIGIN"           always;
    add_header X-Content-Type-Options       "nosniff"              always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;

    # Vite-built hashed assets — immutable, cache 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Other static assets (favicons, og images, screenshots) — 1 day
    location ~* \.(?:jpg|jpeg|gif|png|webp|svg|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback — index.html never cached
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Block hidden files (dotfiles like .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
