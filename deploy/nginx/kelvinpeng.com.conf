# /srv/infra/nginx/conf.d/kelvinpeng.com.conf
#
# Static site for kelvinpeng.com (Vite + React, built artifacts under /srv/sites/kelvinpeng.com)
# Deployed by GitHub Actions via rsync. Reload nginx after first install.
#
# Certs use the same origin.crt/origin.key as erp.conf / crm.conf (Cloudflare Origin cert).
# Host paths mounted into infra_nginx container:
#   /srv/infra/nginx/conf.d -> /etc/nginx/conf.d
#   /srv/infra/nginx/certs  -> /etc/nginx/certs
# Note: /srv/sites is NOT mounted by default — need to add mount in infra_nginx compose.
# See deploy/README.md for one-time VPS init steps.

# Redirect HTTP → HTTPS (apex + www)
server {
    listen 80;
    listen [::]:80;
    server_name kelvinpeng.com www.kelvinpeng.com;
    return 301 https://kelvinpeng.com$request_uri;
}

# Redirect www → apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.kelvinpeng.com;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://kelvinpeng.com$request_uri;
}

# Main site
server {
    listen 443 ssl;
    http2 on;
    server_name kelvinpeng.com;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/sites/kelvinpeng.com;
    index index.html;

    # Security headers
    add_header X-Frame-Options              "SAMEORIGIN"           always;
    add_header X-Content-Type-Options       "nosniff"              always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;

    # Vite-built hashed assets — immutable, cache 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Other static assets (favicons, og images, screenshots) — 1 day
    location ~* \.(?:jpg|jpeg|gif|png|webp|svg|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback — index.html never cached
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# AI Search OS — reverse proxy to aisearch backend container
server {
    listen 80;
    listen [::]:80;
    server_name aisearch.kelvinpeng.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name aisearch.kelvinpeng.com;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # Use a variable to force proxy_pass through nginx.conf's resolver (Docker 127.0.0.11),
    # re-resolving the IP on every request to avoid stale cached IPs after container restarts.
    set $aisearch_backend "aisearch_backend:8000";

    add_header X-Frame-Options              "SAMEORIGIN"           always;
    add_header X-Content-Type-Options       "nosniff"              always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        proxy_pass http://$aisearch_backend/health;
        proxy_set_header Host $host;
    }

    # Single-container architecture: backend FastAPI serves both the /chat API
    # and the static frontend, so all requests proxy straight through.
    location / {
        proxy_pass http://$aisearch_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
