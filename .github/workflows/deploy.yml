name: Deploy kelvinpeng.com

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "deploy/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to VPS via rsync over SSH
        uses: easingthemes/ssh-deploy@v1.5.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SOURCE: "dist/"
          TARGET: ${{ secrets.DEPLOY_PATH }}
          # --delete 删除目标端已不存在的旧文件
          # --chmod 让 nginx 能读
          ARGS: "-rltgoDzvO --delete --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r"

      - name: Smoke test
        run: |
          for i in 1 2 3; do
            if curl -sf -o /dev/null -w "%{http_code}" https://kelvinpeng.com | grep -q "200"; then
              echo "✅ kelvinpeng.com responding 200"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "❌ Smoke test failed"
          exit 1
